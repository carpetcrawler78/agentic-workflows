[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-workflows"
version = "0.1.0"
description = "Visuelles Tool zum Bauen und Ausfuehren von Agentic-Engineering-Workflows."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
agentic-workflows = "src.cli:main"

[tool.setuptools]
packages = ["src"]
